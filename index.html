<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--blue:#3c7cfc;--blue2:#eef4ff;--bg:#f4f6fb;--line:#e8ecf4;--red:#e5484d;--green:#30a46c;--orange:#f59f0a;--gray:#8a93a6;--dark:#1c2333;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--dark);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.55}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
header.appbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:13px 16px;display:flex;align-items:center;justify-content:space-between}
header.appbar .title{font-weight:700;font-size:17px}
header.appbar .sub{color:var(--gray);font-size:12px}
main{flex:1;padding:12px 12px 86px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .tb{flex:1;text-align:center;padding:7px 0 8px;color:var(--gray);font-size:11px;cursor:pointer;user-select:none}
.tabbar .tb .ic{font-size:19px;line-height:1.2;display:block}
.tabbar .tb.on{color:var(--blue);font-weight:600}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(28,35,51,.06)}
.card h3{margin:0 0 10px;font-size:15px}
.btn{display:inline-block;border:none;border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;background:#eef1f7;color:var(--dark);font-family:inherit}
.btn:active{opacity:.85}
.btn-primary{background:var(--blue);color:#fff;font-weight:600}
.btn-danger{background:#fdecec;color:var(--red)}
.btn-green{background:#e8f6ef;color:var(--green)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-block{display:block;width:100%;text-align:center;padding:12px;font-size:15px}
.btn[disabled]{opacity:.5;pointer-events:none}
.muted{color:var(--gray);font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1}
input[type=text],input[type=number],select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;background:#fff;color:var(--dark)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--blue2);color:var(--blue);margin-right:4px}
.tag.gray{background:#f0f2f7;color:var(--gray)}
.tag.red{background:#fdecec;color:var(--red)}
.tag.green{background:#e8f6ef;color:var(--green)}
.tag.orange{background:#fff4e0;color:#b26d00}
.paper-item{display:flex;align-items:center;gap:10px}
.paper-item .meta{flex:1;min-width:0}
.paper-item .name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:36px 20px;color:var(--gray)}
.empty .big{font-size:42px;margin-bottom:8px}
/* 编辑器 */
.qedit{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff}
.qedit .hd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.qedit .no{font-weight:800;color:var(--blue);font-size:15px;flex-shrink:0}
.qedit textarea{margin-bottom:8px}
.oedit{display:flex;gap:6px;align-items:flex-start;margin-bottom:6px}
.oedit .k{width:30px;padding:9px 0;text-align:center;background:#eef1f7;border-radius:8px;font-weight:700;font-size:13px;flex-shrink:0}
.oedit textarea{margin-bottom:0;min-height:38px}
.del-x{border:none;background:#f0f2f7;color:var(--gray);border-radius:8px;padding:8px 10px;cursor:pointer;flex-shrink:0}
.quickrow{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed #eef1f7}
.quickrow:last-child{border-bottom:none}
.quickrow .no{width:38px;font-weight:700;font-size:13px;color:var(--blue);flex-shrink:0}
.quickrow select{padding:5px 6px;font-size:13px}
.quickrow .typeSel{flex:1.5}
.quickrow .ansSel{flex:1}
.divider{height:1px;background:var(--line);margin:12px 0}
/* 做题界面（粉笔式） */
.quiz-wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.quiz-top{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px}

<body>
<div id="app"></div>
<script>
'use strict';
/* ============================================================
   京选刷题 v3 · 粉笔式刷题 + 答题卡 双模式
   - 完整录入（题干+选项+答案，粘贴文本/PDF 解析）→ 粉笔式单题作答
   - 快速建卡（仅题型+答案）→ 纯字母涂卡（自动降级）
   - 每题计时 · 题型得分率 · 双维度诊断 · 错题本 · 本地离线
   ============================================================ */

// ---------- 工具 ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const LETTERS = ['A','B','C','D','E','F','G','H'];
const DEFAULT_TYPES = ['政治理论','常识判断','言语理解','数量关系','图形推理','逻辑判断','判断推理','科学推理','资料分析'];
function fmtSec(s){ s = Math.round(s); if(s < 60) return s + '秒'; const m = Math.floor(s/60); if(m < 60) return m + '分' + (s%60) + '秒'; const h = Math.floor(m/60); return h + '小时' + (m%60) + '分'; }
function fmtClock(s){ s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60, p = n => String(n).padStart(2,'0'); return (h ? p(h)+':' : '') + p(m) + ':' + p(ss); }
function fmtTime(ts){ const d = new Date(ts), p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function hasContent(q){ return !!(q && ((q.stem && q.stem.trim()) || Object.values(q.options || {}).some(v => v && String(v).trim()))); }
let toastTimer = null;
function toast(msg){ const old = document.querySelector('.toast'); if(old) old.remove(); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.remove(), 2400); }

// ---------- 数据层 ----------
const DB = {
  get(k, def){ try{ const v = localStorage.getItem('jxst3_' + k); return v == null ? def : JSON.parse(v); }catch(e){ return def; } },
  set(k, v){ try{ localStorage.setItem('jxst3_' + k, JSON.stringify(v)); return true; }catch(e){ toast('保存失败：浏览器存储空间不足'); return false; } }
};
let papers   = DB.get('papers', []);
let sessions = DB.get('sessions', []);
let wrongs   = DB.get('wrongs', []);
let settings = DB.get('settings', { autoNext:true, timeLimit:150, seenGuide:false });
function savePapers(){ DB.set('papers', papers); }
function saveSessions(){ DB.set('sessions', sessions); }
function saveWrongs(){ DB.set('wrongs', wrongs); }
function saveSettings(){ DB.set('settings', settings); }
// 结构：paper = { id, name, createdAt, questions:[{id, stem, options:{A:..}, answer, type}] }
// 旧版数据迁移：v2（items）→ v3（questions）；不识别的记录清除
(function migrate(){
  let changed = false;
  papers = papers.map(p => {
    if(p && Array.isArray(p.questions)) return p;
    if(p && Array.isArray(p.items)){
      changed = true;
      return { id: p.id || uid('p'), name: p.name, createdAt: p.createdAt || Date.now(), questions: p.items.map(it => ({ id: uid('q'), stem: '', options: {A:'',B:'',C:'',D:''}, answer: it.answer || '', type: it.type || '未分类' })) };
    }
    changed = true; return null;
  }).filter(Boolean);
  sessions = sessions.filter(s => s && Array.isArray(s.qids));
  wrongs = wrongs.filter(w => w && w.q);
  // 题型名归一：'演绎推理' → '逻辑判断'（北京卷官方叫法）
  const RENAME = { '演绎推理': '逻辑判断' };
  papers.forEach(p => { (p.questions||[]).forEach(q => { if(RENAME[q.type]){ q.type = RENAME[q.type]; changed = true; } }); });
  wrongs.forEach(w => { if(w.q && RENAME[w.q.type]){ w.q.type = RENAME[w.q.type]; changed = true; } });
  if(changed){ savePapers(); saveSessions(); saveWrongs(); }
})();

//<<<CORE
// ---------- 答案解析（纯函数） ----------
function extractAnswers(lines){
  const map = {};
  const put = (n, l) => { l = String(l).toUpperCase(); if(n >= 1 && n <= 500 && /^[A-H]$/.test(l)) map[n] = l; };
  const runPair = (line) => {
    let m, re = /(\d{1,3})\s*[.．、:：)]\s*([A-Ha-h])(?![A-Za-z0-9])/g, hit = false;
    while((m = re.exec(line))){ put(+m[1], m[2]); hit = true; }
    return hit;
  };
  const runRange = (line) => {
    let m, re = /(\d{1,3})\s*[-~～—–至到]\s*(\d{1,3})\s*[.．、:：]?\s*([A-Ha-h][A-Ha-h\s　]*)/g, hit = false;
    while((m = re.exec(line))){
      const a = +m[1], b = +m[2], ls = m[3].replace(/[^A-Ha-h]/g, '').toUpperCase();
      if(b > a && b - a <= 60 && ls.length >= b - a + 1){ for(let i = 0; i <= b - a; i++) put(a + i, ls[i]); hit = true; }
    }
    return hit;
  };
  for(const raw of lines){
    const line = raw.replace(/\s+/g, ' ').trim();
    if(!line) continue;
    runRange(line);
    runPair(line);
  }
  return map;
}
function parseAnswerText(text, maxN){
  const map = extractAnswers(String(text).split(/\r?\n/));
  const out = {}; let cnt = 0;
  for(let n = 1; n <= maxN; n++){ if(map[n]){ out[n] = map[n]; cnt++; } }
  return { map: out, count: cnt };
}
function parsePlainLetters(str, maxN){
  const ls = String(str).toUpperCase().replace(/[^A-H]/g, '').split('');
  const out = {}; let cnt = 0;
  for(let i = 0; i < ls.length && i < maxN; i++){ out[i + 1] = ls[i]; cnt++; }
  return { map: out, count: cnt };
}
// ---------- 题目文本解析（题干+选项+答案） ----------
function isNoiseLine(line){
  if(/^[(【(]?\s*(参考)?答案/.test(line) && /[A-H]/.test(line)) return true;
  if(/^[(【(]?\s*解析[】）):：]/.test(line)) return true;
  if(/^(参考答案|答案解析|试题解析)/.test(line)) return true;
  return false;
}
// 章节标题识别：如「一、政治理论」「（一）图形推理」「第一部分 判断推理」→ 题型名；非标题返回 null
function typeFromHeader(line){
  if(!line || line.length > 30) return null;
  const s = String(line).trim();
  const s2 = s
    .replace(/^[（(]\s*[一二三四五六七八九十\d]{1,3}\s*[）)]\s*/, '')
    .replace(/^[一二三四五六七八九十]{1,3}\s*[、.．:：]\s*/, '')
    .replace(/^第\s*[一二三四五六七八九十\d]{1,3}\s*(部分|章|节|篇)?\s*[、.．:：]?\s*/, '')
    .replace(/^\d{1,2}\s*[、.．]\s*/, '')
    .replace(/[\s:：]+$/, '');
  if(!s2 || s2 === s && !/^(图形推理|演绎推理|判断推理|科学推理|资料分析|数量关系|言语理解|常识判断|政治理论)/.test(s2)) {
    // 无序号前缀时要求整行几乎是纯关键词
    if(!(s2.length <= 8 && /^(图形推理|演绎推理|判断推理|科学推理|科推|图推|资料分析|数量关系|言语理解|常识判断|政治理论)$/.test(s2))) return null;
  }
  const KW = [
    ['图形推理','图形推理'], ['图推','图形推理'],
    ['逻辑判断','逻辑判断'], ['演绎推理','逻辑判断'],
    ['类比推理','判断推理'], ['定义判断','判断推理'],
    ['科学推理','科学推理'], ['科推','科学推理'],
    ['判断推理','判断推理'],
    ['资料分析','资料分析'],
    ['数量关系','数量关系'], ['数量','数量关系'],
    ['言语理解与表达','言语理解'], ['言语理解','言语理解'], ['言语','言语理解'],
    ['常识判断','常识判断'], ['常识','常识判断'],
    ['政治理论','政治理论'], ['政治','政治理论']
  ];
  for(const [kw, type] of KW){
    if(!s2.startsWith(kw)) continue;
    const deco = s2.slice(kw.length);
    if(deco === '' || /^(部分|题型|专项|与表达|共?\s*[0-9一二三四五六七八九十]{1,4}\s*题|[（(][^）)]{1,10}[）)])+$/.test(deco)) return type;
  }
  return null;
}
// 标题行深度解析：题型 + 标题里标注的题号范围（如「（一）图形推理（第36～40题）」→ {type,from:36,to:40}）
function headerTypeRange(line){
  if(!line || line.length > 40) return null;
  const type = typeFromHeader(line);
  if(!type) return null;
  const s = String(line).replace(/[，,\s　]/g, ' ');
  let m = s.match(/第\s*(\d{1,3})\s*[-~～—–至到]\s*(\d{1,3})\s*题/) || s.match(/(\d{1,3})\s*[-~～—–至到]\s*(\d{1,3})\s*题/);
  if(m){
    const from = +m[1], to = +m[2];
    if(from >= 1 && to >= from && to <= 500 && to - from <= 60) return { type, from, to };
    return { type, from: null, to: null };
  }
  m = s.match(/第\s*(\d{1,3})\s*题/);
  if(m){ const n = +m[1]; if(n >= 1 && n <= 500) return { type, from: n, to: n }; }
  return { type, from: null, to: null };
}
function splitQuestions(lines){
  const blocks = []; let cur = null; let curType = null;
  const typeByNum = {}; // 标题里标注了题号范围（如「图形推理（第36～40题）」）→ 按题号精确归类
  const numRe = /^(\d{1,3})\s*[.．、]\s*(.+)$/;
  for(const line of lines){
    const h = headerTypeRange(line);
    if(h){
      curType = h.type;
      if(h.from != null){ for(let n = h.from; n <= h.to; n++) typeByNum[n] = h.type; }
      continue;
    }
    const m = line.match(numRe);
    if(m){
      const n = +m[1], rest = m[2];
      let ok = false;
      if(!cur){ ok = (n >= 1 && n <= 3 || !!typeByNum[n]) && !/^\d+([.．]\d+)+/.test(rest); }
      else if(n === cur.num + 1){ ok = true; }
      else if(n > cur.num + 1 && n <= cur.num + 3 && !/^\d/.test(rest)){ ok = true; }
      else if(n > cur.num + 1 && typeByNum[n] && !/^\d/.test(rest)){ ok = true; }
      if(ok){ cur = { num:n, lines:[rest], type: typeByNum[n] || curType }; blocks.push(cur); continue; }
    }
    if(cur) cur.lines.push(line);
  }
  return blocks;
}
function parseBlock(block, ansMap){
  const buf = { stem: [] };
  LETTERS.forEach(l => buf[l] = []);
  let cur = 'stem';
  const push = (p, s) => { s = String(s == null ? '' : s).replace(/\s+$/,''); if(s.trim() !== '') buf[p].push(s.trim()); };
  for(const raw of block.lines){
    const line = raw.replace(/[ \t]+$/, '');
    const re = /([A-H])\s*[．.、]\s*/g;
    const marks = []; let m;
    while((m = re.exec(line)) !== null){
      const prevOk = m.index === 0 || /[\s　]/.test(line[m.index - 1]);
      if(prevOk) marks.push({ L: m[1], start: m.index, end: m.index + m[0].length });
      else re.lastIndex = m.index + 1;
    }
    if(marks.length === 0){ push(cur, line); continue; }
    push(cur, line.slice(0, marks[0].start));
    for(let i = 0; i < marks.length; i++){
      const L = marks[i].L;
      const end = i + 1 < marks.length ? marks[i+1].start : line.length;
      cur = L;
      push(cur, line.slice(marks[i].end, end));
    }
  }
  const q = { id: uid('q'), stem: buf.stem.join('\n').trim(), options: {}, answer: ansMap[block.num] || '', type: block.type || '未分类' };
  LETTERS.forEach(l => { if(buf[l].length) q.options[l] = buf[l].join('\n').trim(); });
  if(!block.type && /根据以下(资料|材料|文字)|根据下列(资料|材料|文字|表格)|根据下(表|图)/.test(q.stem)) q.type = '资料分析';
  return q;
}
function parseTextToQuestions(text){
  const rawLines = String(text).split(/\r?\n/).map(l => l.replace(/\u00a0/g,' ').trim()).filter(l => l !== '');
  const ansMap = extractAnswers(rawLines);
  const lines = rawLines.filter(l => !isNoiseLine(l));
  const blocks = splitQuestions(lines);
  return blocks.map(b => parseBlock(b, ansMap));
}
// 纯答案文本 → 空答题卡（无题干，按题号填答案），用于"只有答案 PDF/文本"场景
function buildAnswerOnlyQuestions(ansMap){
  const nums = Object.keys(ansMap).map(Number).filter(n => n >= 1 && n <= 500).sort((a,b)=>a-b);
  if(!nums.length) return [];
  const maxN = nums[nums.length - 1];
  return Array.from({ length: maxN }, (_, i) => ({ id: uid('q'), stem: '', options: { A:'',B:'',C:'',D:'' }, answer: ansMap[i+1] || '', type: '未分类' }));
}
// 北京选调标准卷结构（2026新结构，共65题）
const BJ_TEMPLATE = [
  { type: '政治理论', n: 10 },
  { type: '常识判断', n: 10 },
  { type: '言语理解', n: 10 },
  { type: '数量关系', n: 5 },
  { type: '图形推理', n: 5 },
  { type: '逻辑判断', n: 10 },
  { type: '科学推理', n: 5 },
  { type: '资料分析', n: 10 }
];
// 按标准结构分配题型：分配前 min(题量, 65) 题（不动题干/选项/答案），返回实际分配数
function applyTemplateTypes(questions){
  if(!questions || !questions.length) return 0;
  let i = 0;
  for(const seg of BJ_TEMPLATE){
    for(let k = 0; k < seg.n && i < 65 && i < questions.length; k++, i++) questions[i].type = seg.type;
  }
  return i;
}
// ---------- 统计核心（qid 版） ----------
function buildStats(session, questions){
  const perQ = []; const byType = {};
  let correct = 0, answered = 0, totalTime = 0;
  questions.forEach((q, i) => {
    const a = session.answers[q.id] || null;
    const rec = { qid: q.id, num: i + 1, type: q.type || '未分类', answer: q.answer || '', choice: a ? a.choice : '', correct: a ? !!a.correct : false, time: a ? (a.time || 0) : 0, marked: a ? !!a.marked : false, skipped: !a };
    perQ.push(rec);
    if(a){ answered++; totalTime += rec.time; if(rec.correct) correct++; }
    if(!byType[rec.type]) byType[rec.type] = { time: 0, ansN: 0 };
    const t = byType[rec.type];
    if(!rec.skipped){ t.time += rec.time; t.ansN++; }
  });
  const scorable = perQ.filter(r => r.answer);
  const totalQ = scorable.length;
  const scoreRate = totalQ ? correct / totalQ : 0;
  const avgTime = answered ? totalTime / answered : 0;
  const types = Object.keys(byType).map(k => {
    const st = scorable.filter(r => r.type === k);
    const sc = st.filter(r => r.correct).length;
    const t = byType[k];
    return { type: k, scorable: st.length, correct: sc, rate: st.length ? sc / st.length : 0, avgTime: t.ansN ? t.time / t.ansN : 0, total: perQ.filter(r => r.type === k).length };
  });
  return { perQ, types, totalQ, answered, correct, scoreRate, avgTime, totalTime };
}

// ---------- PDF 解析 ----------
async function extractTextFromPDF(file, onProgress){
  if(typeof pdfjsLib === 'undefined') throw new Error('PDF 引擎未加载（需联网），请改用「粘贴文本」');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
  const out = [];
  for(let p = 1; p <= pdf.numPages; p++){
    if(onProgress) onProgress(p, pdf.numPages);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = [];
    for(const it of tc.items){
      if(!it.str || !it.str.trim()) continue;
      const x = it.transform[4], y = it.transform[5];
      let row = null;
      for(const r of rows){ if(Math.abs(r.y - y) <= 2.5){ row = r; break; } }
      if(!row){ row = { y, items: [] }; rows.push(row); }
      row.items.push({ x, s: it.str, w: it.width });
    }
    rows.sort((a, b) => b.y - a.y);
    for(const r of rows){
      r.items.sort((a, b) => a.x - b.x);
      let line = '', lastEnd = null;
      for(const it of r.items){
        if(lastEnd !== null && it.x - lastEnd > 6 && !/\s$/.test(line)) line += ' ';
        line += it.s;
        lastEnd = it.x + (it.w || 0);
      }
      const t = line.trim();
      if(t) out.push(t);
    }
    out.push('');
  }
  return out.join('\n');
}

function render(){
  const app = $('#app');

  if(state.quizView){ html = viewQuizRun(); }
  else if(state.wrongRedo){ html = viewWrongRedo(); }
  else if(state.importView){ html = viewImport(); }
  else {
    const titles = { library:'题库', quiz:'刷题', report:'报告', wrong:'错题本', mine:'我的' };
    let main = '';
    if(state.tab === 'library') main = viewLibrary();

    html = `<header class="appbar"><div class="title">${titles[state.tab]}</div><div class="sub">京选刷题</div></header><main>${main}</main>` + tabbarHTML();
  }

  const qs = [];

  toast(filled ? `已按北京选调标准生成65题卡（题型已分配），并从答案 PDF 填入 ${filled} 个答案` : '已按北京选调标准结构生成65题卡（题型已分配）');

// 若第一步暂存了答案 PDF 文本，自动按题号填入并清空暂存
function fillPendingAns(questions){
  if(!state.pendingAnsText || !questions || !questions.length) return 0;
  const { map, count } = parseAnswerText(state.pendingAnsText, questions.length);
  let n = 0;
  for(const k in map){ if(questions[k-1]){ questions[k-1].answer = map[k]; n++; } }
  state.pendingAnsText = null;
  return n;
}
function editPaper(pid){
  const p = papers.find(x => x.id === pid); if(!p) return;
  state.importView = true; state.imp = { step: 1, name: p.name, questions: p.questions, srcPaperId: p.id }; render();
}
function parseTextEntry(text, nameFallback){
  let qs = parseTextToQuestions(text);
  if(qs.length === 0){
    // 无题号但有答案（如纯答案 PDF/文本）→ 自动生成空答题卡并填入答案
    const ansOnly = buildAnswerOnlyQuestions(extractAnswers(String(text).split(/\r?\n/)));
    if(!ansOnly.length) throw new Error('未能识别出题目或答案（需要"1. "题号，或"1-5 BADCB"式答案）');
    const ansN = ansOnly.filter(q => q.answer).length;
    state.imp = { step: 1, name: nameFallback || '', questions: ansOnly, srcPaperId: null };
    state.pendingAnsText = null;
    render();
    toast(`未识别到题干，已按纯答案建卡：${ansOnly.length} 题（填入答案 ${ansN} 个）`);
    return;
  }
  const ansN = qs.filter(q => q.answer).length;
  const fullN = qs.filter(hasContent).length;
  state.imp = { step: 1, name: nameFallback || '', questions: qs, srcPaperId: null };
  let fromPdf = 0;
  if(!ansN){ fromPdf = fillPendingAns(qs); } // 题目本身没带答案时，自动用第一步暂存的答案 PDF 填入
  render();
  toast(`解析出 ${qs.length} 题（带题干${fullN}、含答案${ansN}）${fromPdf ? `，已从答案 PDF 填入 ${fromPdf} 个` : ''}，请校对`);
}
async function handlePDFFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const st = $('#pdfStatus');
  try{
    st.textContent = '正在解析 PDF，请稍候…';
    const text = await extractTextFromPDF(f, (p, n) => { st.textContent = `正在解析第 ${p}/${n} 页…`; });
    if(!text.trim()) throw new Error('未提取到文字，可能是扫描图片版 PDF');

  }catch(e){ st.textContent = '⚠️ ' + e.message; }
}
// 第一步：上传答案 PDF（可选）→ 提取文本暂存，试卷解析后自动填入；若只传答案也能单独建卡
async function handleAnsPDFFile0(input){

// 第二步：上传纯答案 PDF，按题号覆盖填入答案
async function handleAnsPDFFile(input){
  const f = input.files && input.files[0]; if(!f) return;
  const imp = state.imp; if(!imp) return;
  const st = $('#ansPdfStatus');
  try{
    st.textContent = '正在解析答案 PDF…';
    const text = await extractTextFromPDF(f, (p, n) => { st.textContent = `正在解析答案 PDF 第 ${p}/${n} 页…`; });
    if(!text.trim()) throw new Error('未提取到文字，可能是扫描图片版 PDF');
    const { map, count } = parseAnswerText(text, imp.questions.length);
    if(!count) throw new Error('未解析出答案（需要形如 1-5 BADCB 或 11.B 的答案行）');
    let n = 0;
    for(const k in map){ if(imp.questions[k-1]){ imp.questions[k-1].answer = map[k]; n++; } }
    render();
    toast(`已从 PDF 填入 ${n} 个答案（共 ${imp.questions.length} 题）`);
  }catch(e){ st.textContent = '⚠️ ' + e.message; input.value = ''; }
}
function applyCountEdit(){
  const imp = state.imp;
  const n = prompt('请输入新的题量（原 ' + imp.questions.length + ' 题，增删只影响尾部）：');
  if(n === null) return;
  const num = Math.max(1, Math.min(300, +n || 0));
  if(!num){ toast('题量无效'); return; }
  const qs = Array.from({ length: num }, (_, i) => imp.questions[i] || { id: uid('q'), stem: '', options: { A:'',B:'',C:'',D:'' }, answer: '', type: '未分类' });
  imp.questions = qs; render();
}
function batchType(){
  const imp = state.imp;
  const a = +$('#btFrom').value, b = +$('#btTo').value, t = $('#btType').value;
  if(!a || !b){ toast('请输入起止题号'); return; }
  const lo = Math.min(a, b), hi = Math.max(a, b);
  let n = 0;
  imp.questions.forEach((q, i) => { if(i + 1 >= lo && i + 1 <= hi){ q.type = t; n++; } });
  render(); toast(`已把 ${n} 道题设为「${t}」`);
}
function batchAnsText(){
  const imp = state.imp;
  const { map, count } = parseAnswerText($('#ansText').value, imp.questions.length);
  if(!count){ toast('未解析出答案，请检查格式'); return; }
  for(const n in map){ imp.questions[n-1].answer = map[n]; }
  render(); toast(`已覆盖填入 ${count} 个答案`);
}
function savePaper(){
  const imp = state.imp;
  const name = ($('#paperName') ? $('#paperName').value : '').trim();
  if(!name){ toast('请填写试卷名称'); return; }
  if(imp.questions.length === 0){ toast('没有题目，无法保存'); return; }
  const noAns = imp.questions.filter(q => !q.answer).length;
  const blankN = imp.questions.filter(q => !hasContent(q)).length;
  const doSave = () => {
    if(imp.srcPaperId){
      const p = papers.find(x => x.id === imp.srcPaperId);
      if(p){ p.name = name; p.questions = imp.questions; savePapers(); toast('试卷已更新'); }
    } else {
      papers.push({ id: uid('p'), name, createdAt: Date.now(), questions: imp.questions }); savePapers(); toast('试卷已保存');
    }
    state.importView = false; state.imp = null; state.tab = 'quiz'; render();
  };
  let msg = '';
  if(noAns > 0) msg += `有 ${noAns} 题未设置答案（不计分）`;
  if(blankN > 0) msg += (msg ? '，' : '') + `有 ${blankN} 题无题干选项（按纯字母涂卡显示）`;
  if(msg){ if(confirm(msg + '。确定保存吗？')) doSave(); } else doSave();
}

function beginQuiz(pid){
  const p = papers.find(x => x.id === pid); if(!p) return;
  const modeEl = document.querySelector('input[name=qmode]:checked');
  const mode = modeEl ? modeEl.value : 'full';
  let questions = p.questions.slice();
  let types = null;
  if(mode === 'special'){
    types = [...document.querySelectorAll('.sp-type:checked')].map(el => el.value);
    if(!types.length){ toast('请至少勾选一个题型'); return; }
    questions = questions.filter(q => types.includes(q.type || '未分类'));
    if(!questions.length){ toast('所选题型下没有题目'); return; }
  }
  const lim = +($('#timeLimitInput') ? $('#timeLimitInput').value : 0) || 0;
  settings.autoNext = !!(document.querySelector('#autoNextInput') && document.querySelector('#autoNextInput').checked);
  if(lim) settings.timeLimit = lim; saveSettings();
  const s = { id: uid('s'), paperId: p.id, paperName: p.name, mode, types, timeLimit: lim ? lim * 60 : null, startedAt: Date.now(), finishedAt: null, answers: {}, status: 'ongoing', qids: questions.map(q => q.id) };
  sessions.push(s); saveSessions();
  state.quizConfigPid = null;
  enterQuiz(s.id);
}
function enterQuiz(sid){
  const s = sessions.find(x => x.id === sid); if(!s) return;
  const p = papers.find(x => x.id === s.paperId);
  if(!p){ toast('试卷已被删除，无法继续'); sessions = sessions.filter(x => x.id !== sid); saveSessions(); render(); return; }
  let pos = s.qids.findIndex(qid => !s.answers[qid]);
  if(pos === -1) pos = 0;
  state.quizView = true; state.tab = 'quiz'; state.sheetOpen = false;
  state.quiz = { sessionId: sid, pos, shownAt: Date.now() };
  render();
}
function curInfo(){
  const s = currentSession(), q = state.quiz;
  if(!s || !q) return null;
  const p = papers.find(x => x.id === s.paperId);
  if(!p) return null;
  const qid = s.qids[q.pos];
  const question = p.questions.find(x => x.id === qid);
  return question ? { question, pos: q.pos, total: s.qids.length } : null;
}
function pick(key){
  const s = currentSession(), q = state.quiz;
  const cur = curInfo(); if(!cur) return;
  const t = Math.max(1, Math.round((Date.now() - q.shownAt) / 1000));
  s.answers[cur.question.id] = { choice: key, correct: key === cur.question.answer, time: t };
  saveSessions();
  if(settings.autoNext) nextQ(); else render();
}
function nextQ(){
  const q = state.quiz;
  if(q.pos + 1 >= q_total()){ if(confirm('已经是最后一题，交卷吗？')) finishQuiz(); else render(); return; }
  q.pos++; q.shownAt = Date.now(); render();
}
function q_total(){ const s = currentSession(); return s ? s.qids.length : 0; }
function prevQ(){
  const q = state.quiz, s = currentSession();
  if(q.pos > 0){ q.pos--; const id = s.qids[q.pos]; if(!s.answers[id]) q.shownAt = Date.now(); render(); }
}
function jumpToQ(qid){
  const s = currentSession();
  const pos = s.qids.indexOf(qid);
  if(pos > -1){ state.quiz.pos = pos; if(!s.answers[qid]) state.quiz.shownAt = Date.now(); state.sheetOpen = false; render(); }
}
function toggleMark(){
  const s = currentSession();
  const cur = curInfo(); if(!cur) return;
  const a = s.answers[cur.question.id];
  if(a){ a.marked = !a.marked; saveSessions(); render(); } else { toast('请先作答本题再标记'); }
}
function finishQuiz(){
  const s = currentSession();
  if(!s) return;
  const unanswered = s.qids.filter(id => !s.answers[id]).length;
  if(unanswered > 0 && !confirm(`还有 ${unanswered} 题未作答（记为跳过），确定交卷吗？`)) return;
  s.status = 'done'; s.finishedAt = Date.now(); saveSessions();
  const p = papers.find(x => x.id === s.paperId);
  if(p){
    s.qids.forEach(qid => {
      const a = s.answers[qid];
      const qq = p.questions.find(x => x.id === qid);
      if(qq && a && !a.correct && qq.answer){
        const exist = wrongs.find(w => w.paperId === s.paperId && w.qid === qid);
        if(exist){ exist.myChoice = a.choice; exist.addedAt = Date.now(); }
        else wrongs.push({ id: uid('w'), paperId: s.paperId, paperName: s.paperName, qid, q: { stem: qq.stem || '', options: Object.assign({}, qq.options), answer: qq.answer, type: qq.type || '未分类' }, myChoice: a.choice, addedAt: Date.now(), resolved: false, redone: 0 });
      }
    });
    saveWrongs();
  }
  state.quizView = false; state.quiz = null; state.sheetOpen = false; state.tab = 'report'; state.reportOpenId = s.id; render();
}

      <div class="opts">${keys.map(k => `<div class="opt ${a && a.choice === k ? 'sel' : ''}" data-act="pick" data-key="${k}"><span class="k">${k}</span><span>${esc(question.options[k] || '')}</span></div>`).join('')}</div>`;
  } else {
    body = `<div class="q-num" style="text-align:center">${esc(s.mode === 'special' ? '专项练习' : s.paperName)} · 第 ${q.pos + 1} 题 ${question.answer ? '' : '<span class="tag red">未设答案</span>'}</div>
      <div class="q-typecard"><span class="tag">${esc(question.type || '未分类')}</span></div>

      <div class="muted" style="text-align:center;margin-top:14px">本题未录题干，按纯涂卡显示 · 点选项即计时</div>`;
  }
  let sheetHTML = '';
  if(state.sheetOpen){
    const paper = papers.find(x => x.id === s.paperId);

      return `<div class="${cls.join(' ')}" data-act="sheet-jump" data-qid="${qid}" title="${esc(qq ? (qq.type||'') : '')}">${qq ? (s.qids.indexOf(qid)+1) : '?'}</div>`;

  }

      <button class="btn" data-act="quiz-prev" ${q.pos === 0 ? 'disabled' : ''}>‹</button>

      ${q.pos + 1 >= cur.total ? '<button class="btn btn-primary" data-act="quiz-finish">交卷</button>' : '<button class="btn btn-primary" data-act="quiz-next">下一题 ›</button>'}

function viewReportDetail(){
  const s = sessions.find(x => x.id === state.reportOpenId);
  if(!s){ state.reportOpenId = null; return viewReportList(); }
  const p = papers.find(x => x.id === s.paperId);
  const qs = p ? s.qids.map(id => p.questions.find(q => q.id === id)).filter(Boolean) : [];
  if(!qs.length) return `<div class="card empty">试卷已被删除，报告数据不完整</div><div class="card"><button class="btn btn-block" data-act="report-back">‹ 返回列表</button></div>`;
  const st = buildStats(s, qs);
  let html = `<header class="appbar"><div class="title"><span class="backlink" data-act="report-back">‹ 报告列表</span></div><div class="sub">${esc(s.paperName)}</div></header><main>`;
  html += `<div class="card"><div style="font-weight:700;margin-bottom:12px">${esc(s.paperName)} · ${s.mode === 'special' ? '专项（' + esc((s.types||[]).join('、')) + '）' : '整卷'}</div>
    <div class="stat-grid">
      <div><div class="v">${st.totalQ ? Math.round(st.scoreRate * 100) + '%' : '--'}</div><div class="l">得分率</div></div>
      <div><div class="v green">${st.correct}<span style="font-size:13px;color:var(--gray)">/${st.totalQ}</span></div><div class="l">答对/计分题</div></div>
      <div><div class="v">${fmtSec(st.totalTime)}</div><div class="l">总用时</div></div></div>
    <div class="muted" style="margin-top:10px;text-align:center">平均每题 ${fmtSec(st.avgTime)} · ${fmtTime(s.startedAt)} ~ ${fmtTime(s.finishedAt)}</div></div>`;
  html += `<div class="card"><h3>📌 题型统计</h3><table class="stats"><tr><th>题型</th><th>题数</th><th>得分率</th><th>平均用时</th></tr>`;
  st.types.forEach(t => {
    html += `<tr><td>${esc(t.type)}</td><td>${t.correct}/${t.scorable}</td><td><span class="tag ${t.rate >= 0.8 ? 'green' : t.rate >= 0.6 ? 'orange' : 'red'}">${Math.round(t.rate * 100)}%</span></td><td>${fmtSec(t.avgTime)}</td></tr>`;
  });
  html += `</table></div>`;
  let diags = '';
  const lowAcc = st.types.filter(t => t.scorable > 0 && t.rate < 0.6);
  if(lowAcc.length) diags += `<div class="diag red">🎯 <b>需提高准确率</b>：${lowAcc.map(t => `${esc(t.type)}（${Math.round(t.rate*100)}%）`).join('、')}——建议专项回炉</div>`;
  const slow = st.types.filter(t => t.avgTime > st.avgTime * 1.2 && t.avgTime > 0);
  if(slow.length) diags += `<div class="diag orange">🐌 <b>需提高做题速度</b>：${slow.map(t => `${esc(t.type)} ${fmtSec(t.avgTime)}/题（全卷均值 ${fmtSec(st.avgTime)}）`).join('')}</div>`;
  const fastOk = st.types.filter(t => t.scorable > 0 && t.rate >= 0.8 && t.avgTime <= st.avgTime);
  if(fastOk.length) diags += `<div class="diag blue">✅ <b>状态良好</b>：${fastOk.map(t => esc(t.type)).join('、')}——保持手感即可</div>`;
  if(!st.answered) diags += `<div class="diag">本次没有作答记录</div>`;
  html += `<div class="card"><h3>🩺 诊断建议</h3>${diags}</div>`;
  const maxTime = Math.max(...st.perQ.map(r => r.time), 1);
  html += `<div class="card qlist"><h3>📋 逐题明细（🚩=标记，慢=用时超均值50%）</h3>`;
  st.perQ.forEach(r => {
    const slowTag = r.time > st.avgTime * 1.5 && !r.skipped ? ' <span class="tag orange">慢</span>' : '';
    const badge = r.skipped ? 'skip' : (r.correct ? 'ok' : 'no');
    const sym = r.skipped ? '—' : (r.correct ? '✓' : '✗');
    html += `<div class="qi"><span class="badge ${badge}">${sym}</span>
      <span style="width:46px">第${r.num}题</span>
      <span class="tag gray" style="flex-shrink:0">${esc(r.type)}</span>
      <span class="grow muted" style="font-size:12.5px">${r.skipped ? '跳过' : '选' + r.choice + (r.correct ? '' : '（应' + r.answer + '）')}</span>
      <span class="muted" style="font-variant-numeric:tabular-nums">${r.skipped ? '' : fmtSec(r.time) + slowTag}</span>
      <span style="width:50px;height:5px;background:#eef1f7;border-radius:3px;overflow:hidden;flex-shrink:0"><i style="display:block;height:100%;width:${Math.round(r.time / maxTime * 100)}%;background:${r.time > st.avgTime * 1.5 ? 'var(--orange)' : 'var(--blue)'}"></i></span>
      ${r.marked ? '🚩' : ''}</div>`;
  });
  html += `</div>`;
  const wrongIds = st.perQ.filter(r => !r.skipped && !r.correct && r.answer).map(r => r.qid);
  if(wrongIds.length) html += `<button class="btn btn-green btn-block" data-act="redo-wrong-from-report" data-ids="${wrongIds.join(',')}">⭐ 立即重做本次错题（${wrongIds.length} 题）</button><div style="height:20px"></div>`;
  return html;
}

// ---------- 错题本 ----------
function viewWrong(){
  const list = wrongs.filter(w => state.wrongShowResolved ? true : !w.resolved).sort((a, b) => b.addedAt - a.addedAt);
  const types = [...new Set(wrongs.map(w => w.q.type))];
  let html = `<div class="row" style="margin-bottom:10px"><div class="grow muted">待掌握错题 ${wrongs.filter(w=>!w.resolved).length} 道</div>
    <label class="muted" style="display:flex;align-items:center;gap:4px;cursor:pointer"><input type="checkbox" data-act="wrong-show-resolved" ${state.wrongShowResolved?'checked':''}> 显示已掌握</label></div>`;
  if(types.length > 1){
    html += `<div class="card" style="padding:10px 12px"><div class="row" style="flex-wrap:wrap;gap:6px">
      <span class="tag ${(state.wrongFilter||'all')==='all'?'':'gray'}" data-act="wrong-filter" data-v="all" style="cursor:pointer">全部</span>
      ${types.map(t => `<span class="tag ${state.wrongFilter===t?'':'gray'}" data-act="wrong-filter" data-v="${esc(t)}" style="cursor:pointer">${esc(t)}</span>`).join('')}</div></div>`;
  }
  const shown = list.filter(w => (state.wrongFilter||'all') === 'all' || w.q.type === state.wrongFilter);
  if(!shown.length){ html += `<div class="card empty"><div class="big">🌟</div>${wrongs.length ? '没有待掌握的错题，太棒了！' : '错题本还是空的<br><span style="font-size:13px">做题后错题会自动收进来</span>'}</div>`; }
  shown.forEach(w => {
    const keys = Object.keys(w.q.options || {}).sort();
    const rich = hasContent(w.q);
    html += `<div class="card"><div class="row" style="margin-bottom:6px"><span class="tag">${esc(w.q.type)}</span><span class="tag gray">${esc(w.paperName)}</span>${w.resolved?'<span class="tag green">已掌握</span>':''}<div class="grow"></div><button class="btn btn-sm btn-danger" data-act="wrong-del" data-wid="${w.id}">移除</button></div>
      ${rich ? `<div class="wrong-q">${esc(w.q.stem)}</div>${keys.map(k => (w.q.options[k] ? `<div class="muted" style="font-size:13px;padding:2px 0">${k}. ${esc(w.q.options[k])}</div>` : '')).join('')}` : ''}
      <div class="divider"></div>
      <div class="row"><span class="tag ${w.resolved ? 'green' : 'red'}">你的答案：${esc(w.myChoice || '未答')}（正确：${esc(w.q.answer)}）</span>${w.redone ? `<span class="muted">已重做${w.redone}次</span>` : ''}<div class="grow"></div></div></div>`;
  });
  const todo = wrongs.filter(w => !w.resolved && ((state.wrongFilter||'all') === 'all' || w.q.type === state.wrongFilter));
  if(todo.length) html += `<button class="btn btn-primary btn-block" data-act="wrong-redo-start">▶ 重做这些错题（${todo.length} 题）</button><div style="height:20px"></div>`;
  return html;
}
function startWrongRedo(list){
  if(!list.length){ toast('没有可重做的错题'); return; }
  state.wrongRedo = { list, pos: 0, okCount: 0, answered: 0 };
  render();
}
function viewWrongRedo(){
  const r = state.wrongRedo;
  const w = r.list[r.pos];
  if(!w) return wrongRedoSummary();
  const keys = Object.keys(w.q.options || {}).sort();
  if(!keys.length) keys.push('A','B','C','D');
  const rich = hasContent(w.q);
  let body;
  if(rich){
    body = `<div class="q-num">来自「${esc(w.paperName)}」</div>
      <div class="q-stem">${esc(w.q.stem) || '<span class="muted">（未录题干）</span>'}</div>
      <div class="opts">${keys.map(k => `<div class="opt" data-act="wrong-pick" data-key="${k}"><span class="k">${k}</span><span>${esc(w.q.options[k] || '')}</span></div>`).join('')}</div>`;
  } else {
    body = `<div class="q-num" style="text-align:center">来自「${esc(w.paperName)}」</div>
      <div class="q-typecard"><span class="tag">${esc(w.q.type)}</span></div>
      <div class="big-num">${r.pos + 1}<span style="font-size:24px;color:var(--gray);font-weight:600"> / ${r.list.length} 题</span></div>
      <div class="optgrid">${keys.map(k => `<div class="optcell" data-act="wrong-pick" data-key="${k}">${k}</div>`).join('')}</div>`;
  }
  return `<div class="quiz-wrap"><div class="quiz-top"><div class="bar">
    <span class="backlink" data-act="wrong-redo-exit">‹ 退出</span>
    <span>错题重做 ${r.pos + 1}/${r.list.length} · 答对 ${r.okCount}</span></div>
    <div class="progress"><i style="width:${Math.round(r.pos / r.list.length * 100)}%"></i></div></div>
    <div class="q-body">${body}</div></div>`;
}
function wrongPick(key){
  const r = state.wrongRedo, w = r.list[r.pos];
  r.answered++;
  if(key === w.q.answer){ r.okCount++; w.resolved = true; } else { w.resolved = false; }
  w.redone = (w.redone || 0) + 1; w.myChoice = key; saveWrongs();
  r.pos++;
  render();
  if(r.pos <= r.list.length) toast(key === w.q.answer ? '✓ 答对了！' : '✗ 答错了，正确答案 ' + w.q.answer);
}
function wrongRedoSummary(){
  const r = state.wrongRedo;
  return `<div class="quiz-wrap"><main style="padding-top:60px"><div class="card empty"><div class="big">🎉</div>
    <div style="font-weight:700;font-size:17px;margin-bottom:8px">重做完成</div>
    共 ${r.answered} 题，答对 ${r.okCount} 题（${Math.round(r.okCount / Math.max(1, r.answered) * 100)}%）<br>
    <span class="muted">答对的已标为「已掌握」，仍错的保留在错题本</span>
    <div style="margin-top:16px"><button class="btn btn-primary" data-act="wrong-redo-exit">返回错题本</button></div></div></main></div>`;
}

    <div class="muted" style="text-align:center;padding:6px 0 20px">京选刷题 v3.5 · 粉笔式刷题 + 答题卡 · 纯本地离线</div>`;
}
function exportData(){
  const data = JSON.stringify({ app: '京选刷题', version: 3, exportedAt: Date.now(), papers, sessions, wrongs, settings }, null, 1);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '京选刷题备份_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('备份已导出');
}
function importData(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const d = JSON.parse(reader.result);
      if(!d.papers) throw new Error('文件格式不对');
      if(!confirm(`将导入 ${d.papers.length} 套试卷、${(d.sessions||[]).length} 条记录，并【覆盖】当前全部数据，确定？`)) return;
      papers = (d.papers||[]).filter(p => Array.isArray(p.questions) || Array.isArray(p.items));
      sessions = (d.sessions||[]).filter(s => Array.isArray(s.qids) || typeof s.n === 'number');
      wrongs = (d.wrongs||[]).filter(w => w && (w.q || typeof w.num === 'number'));
      settings = Object.assign(settings, d.settings || {});
      // 兼容旧结构
      papers = papers.map(p => Array.isArray(p.questions) ? p : { id: p.id || uid('p'), name: p.name, createdAt: p.createdAt || Date.now(), questions: p.items.map(it => ({ id: uid('q'), stem: '', options: {A:'',B:'',C:'',D:''}, answer: it.answer || '', type: it.type || '未分类' })) });
      sessions = sessions.filter(s => Array.isArray(s.qids));
      wrongs = wrongs.filter(w => w.q);
      savePapers(); saveSessions(); saveWrongs(); saveSettings();
      toast('导入成功'); state.tab = 'library'; render();
    }catch(e){ toast('导入失败：' + e.message); }
  };
  reader.readAsText(file);
}

// ---------- 事件 ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  if(act === 'sheet-stop') return;
  const imp = state.imp;
  switch(act){
    case 'tab': state.tab = el.dataset.tab; state.reportOpenId = null; state.quizConfigPid = null; render(); break;
    case 'dismiss-guide': settings.seenGuide = true; saveSettings(); render(); break;
    case 'load-demo': { if(papers.find(p => p.name.includes('示例'))){ toast('示例卷已存在题库中'); state.tab='quiz'; render(); break; } papers.push(demoPaper()); savePapers(); toast('示例卷已加入题库'); state.tab = 'quiz'; render(); break; }
    case 'import-start': startImport(); break;
    case 'quick-start': startQuick(); break;
    case 'import-exit': state.importView = false; state.imp = null; render(); break;
    case 'parse-paste': { const t = $('#pasteText').value; if(!t.trim()){ toast('请先粘贴文本'); break; } try{ parseTextEntry(t, ''); }catch(err){ toast(err.message); } break; }
    case 'edit-open': editPaper(el.dataset.pid); break;
    case 'del-paper': { const p = papers.find(x => x.id === el.dataset.pid); if(p && confirm(`删除试卷「${p.name}」？\n（已生成的报告和错题不受影响）`)){ papers = papers.filter(x => x.id !== p.id); savePapers(); render(); } break; }
    case 'apply-count': applyCountEdit(); break;
    case 'apply-template': {
      const imp2 = state.imp; if(!imp2) break;
      if(imp2.questions.length === 65){
        const n2 = applyTemplateTypes(imp2.questions);
        render(); toast(`已按北京选调标准结构分配 ${n2} 题题型`);
      } else if(confirm(`当前共 ${imp2.questions.length} 题（标准卷为 65 题）。套用后将把前 65 题按标准结构分配题型，其余题保持不变。继续吗？`)){
        const n2 = applyTemplateTypes(imp2.questions);
        render(); toast(`已按北京选调标准结构分配 ${n2} 题题型`);
      }
      break;
    }
    case 'batch-type': batchType(); break;
    case 'batch-ans-text': batchAnsText(); break;
    case 'save-paper': savePaper(); break;
    case 'quiz-config': state.tab = 'quiz'; state.quizConfigPid = el.dataset.pid; render(); break;
    case 'quiz-begin': beginQuiz(el.dataset.pid); break;
    case 'quiz-resume': enterQuiz(el.dataset.sid); break;
    case 'quiz-abandon': { if(confirm('放弃后本次作答将删除（不生成报告），确定？')){ sessions = sessions.filter(x => x.id !== el.dataset.sid); saveSessions(); render(); } break; }
    case 'pick': { const s = currentSession(); const cur = curInfo(); if(cur && !s.answers[cur.question.id]) pick(el.dataset.key); break; }
    case 'quiz-next': nextQ(); break;
    case 'quiz-prev': prevQ(); break;
    case 'quiz-mark': toggleMark(); break;
    case 'quiz-finish': finishQuiz(); break;
    case 'quiz-pause': { if(confirm('暂存退出？进度已保存，可随时回来继续。')){ state.quizView = false; state.quiz = null; state.sheetOpen = false; state.tab = 'quiz'; render(); } break; }
    case 'quiz-skip': { const s = currentSession(); const cur = curInfo(); if(cur && !s.answers[cur.question.id]){ s.answers[cur.question.id] = { choice: '', correct: false, time: 0 }; saveSessions(); } nextQ(); break; }
    case 'sheet-open': state.sheetOpen = true; render(); break;
    case 'sheet-close': state.sheetOpen = false; render(); break;
    case 'sheet-jump': jumpToQ(el.dataset.qid); break;
    case 'report-open': state.reportOpenId = el.dataset.sid; render(); break;
    case 'report-back': state.reportOpenId = null; render(); break;
    case 'redo-wrong-from-report': { const ids = el.dataset.ids.split(','); const s = sessions.find(x => x.id === state.reportOpenId); const p = papers.find(x => x.id === s.paperId); const list = ids.map(id => { const qq = p.questions.find(q => q.id === id); const a = s.answers[id]; return { id: uid('w'), paperId: s.paperId, paperName: s.paperName, qid: id, q: { stem: qq.stem || '', options: Object.assign({}, qq.options), answer: qq.answer, type: qq.type || '未分类' }, myChoice: a ? a.choice : '', addedAt: Date.now(), resolved: false, redone: 0 }; }); startWrongRedo(list); break; }
    case 'wrong-filter': state.wrongFilter = el.dataset.v; render(); break;
    case 'wrong-del': if(confirm('从错题本移除？')){ wrongs = wrongs.filter(w => w.id !== el.dataset.wid); saveWrongs(); render(); } break;
    case 'wrong-redo-start': { const todo = wrongs.filter(w => !w.resolved && ((state.wrongFilter||'all') === 'all' || w.q.type === state.wrongFilter)); startWrongRedo(todo.slice()); break; }
    case 'wrong-pick': wrongPick(el.dataset.key); break;
    case 'wrong-redo-exit': state.wrongRedo = null; state.tab = 'wrong'; render(); break;
    case 'export-data': exportData(); break;
    case 'clear-all': if(confirm('确定清空全部数据（试卷/记录/错题）？不可恢复！') && confirm('再次确认：真的要清空吗？')){ papers = []; sessions = []; wrongs = []; settings = { autoNext: true, timeLimit: 150, seenGuide: true }; savePapers(); saveSessions(); saveWrongs(); saveSettings(); render(); toast('已清空'); } break;
    case 'q-del': imp.questions = imp.questions.filter(q => q.id !== el.dataset.qid); render(); break;
    case 'q-add': imp.questions.push({ id: uid('q'), stem: '', options: { A:'',B:'',C:'',D:'' }, answer: '', type: '未分类' }); render(); break;
    case 'q-opt-add': { const q = imp.questions.find(x => x.id === el.dataset.qid); const ks = Object.keys(q.options); const nextL = LETTERS[ks.length]; if(nextL){ q.options[nextL] = ''; render(); } break; }
    case 'q-opt-del': { const q = imp.questions.find(x => x.id === el.dataset.qid); const old = el.dataset.key; const ks = Object.keys(q.options).sort(); if(ks.length <= 2){ toast('至少保留两个选项'); break; } const newOpts = {}; const remap = {}; ks.filter(k => k !== old).forEach((k, i) => { remap[k] = LETTERS[i]; newOpts[LETTERS[i]] = q.options[k]; }); q.options = newOpts; if(q.answer === old) q.answer = ''; else if(remap[q.answer]) q.answer = remap[q.answer]; render(); break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, imp = state.imp;
  if(imp){
    if(act === 'q-type'){ const q = imp.questions.find(x => x.id === el.dataset.qid); if(q) q.type = el.value; }
    else if(act === 'q-ans'){ const q = imp.questions.find(x => x.id === el.dataset.qid); if(q) q.answer = el.value; }
    else if(act === 'q-stem'){ const q = imp.questions.find(x => x.id === el.dataset.qid); if(q) q.stem = el.value; }
    else if(act === 'q-opt'){ const q = imp.questions.find(x => x.id === el.dataset.qid); if(q) q.options[el.dataset.key] = el.value; }
  }
  if(act === 'set-auto-next'){ settings.autoNext = el.checked; saveSettings(); }
  else if(act === 'set-timelimit'){ settings.timeLimit = Math.max(0, +el.value || 0); saveSettings(); }
  else if(act === 'import-data'){ if(el.files && el.files[0]) importData(el.files[0]); el.value = ''; }
  else if(act === 'wrong-show-resolved'){ state.wrongShowResolved = el.checked; render(); }
  if(e.target && e.target.name === 'qmode'){
    const box = document.querySelector('#specialBox'); if(box) box.style.display = e.target.value === 'special' ? 'block' : 'none';
  }
});
document.addEventListener('change', e => {
  if(e.target && e.target.id === 'pdfFile' && e.target.files && e.target.files[0]) handlePDFFile(e.target);
  if(e.target && e.target.id === 'ansPdfFile0' && e.target.files && e.target.files[0]) handleAnsPDFFile0(e.target);
  if(e.target && e.target.id === 'ansPdfFile' && e.target.files && e.target.files[0]) handleAnsPDFFile(e.target);
});
setInterval(quizTick, 1000);
render();

// ---------- 添加到主屏幕引导（APP化使用） ----------
(function pwaTip(){
  const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if(standalone) return;
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  if(!isMobile) return;
  setTimeout(() => {
    if(localStorage.getItem('jxst3_pwaTip')) return;
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:76px;z-index:200;background:linear-gradient(135deg,#3c7cfc,#5a9bff);color:#fff;border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.6;box-shadow:0 4px 16px rgba(60,124,252,.4)';
    bar.innerHTML = '📱 <b>当 APP 使用：</b>' + (isIOS
      ? '用 Safari 底部「分享」按钮 → 选「添加到主屏幕」，即可像 APP 一样全屏打开'
      : '用浏览器菜单（⋮）→ 选「添加到主屏幕/安装应用」，即可像 APP 一样全屏打开')
      + '<div style="margin-top:8px;text-align:right"><button id="pwaTipOk" style="border:none;background:rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer">知道了</button></div>';
    document.body.appendChild(bar);
    bar.querySelector('#pwaTipOk').addEventListener('click', () => { localStorage.setItem('jxst3_pwaTip', '1'); bar.remove(); });
  }, 1800);
})();
</script>
